[nosetests]
verbosity=2
with-spec=1
spec-color=1
with-coverage=1
cover-erase=1
cover-package=service
cover-min-percentage=95

[coverage:run]
branch = False
omit = tests/*

[coverage:report]
show_missing = True
fail_under = 95

[flake8]
max-line-length = 127
max-complexity = 10
exclude = .git,__pycache__,venv

[pylint.master]
ignore = CVS,tests

[pylint.messages_control]
disable = C0114,C0115,C0116,R0903,E1101

[pylint.format]
max-line-length = 127
