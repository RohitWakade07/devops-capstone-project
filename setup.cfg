[nosetests]
verbosity=2
with-coverage=1
cover-erase=1
cover-package=service

[coverage:report]
show_missing = True

[flake8]
max-line-length = 127
exclude = .git,__pycache__,venv

[pylint.master]
ignore = CVS,tests

[pylint.messages_control]
disable = C0114,C0115,C0116,R0903,E1101

[pylint.format]
max-line-length = 127
